---
name: wordcount
title: Word Count (LIWC-style)
menuGroup: Text
version: '0.1.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: textVar
      title: Text Variable
      type: Variable
      permitted: [id, factor]

    - name: dictionary
      title: Dictionary
      type: String
      default: ''
      description: |
        Paste your wordlist. Two formats are accepted:
        1) TSV with a DicTerm header (multi-line), or
        2) single-line flat format: very:Intensifiers; not:Negations; can*:Modal_Expressions

    - name: detectedWords
      title: Include detected words columns
      type: Bool
      default: false

    - name: saveResults
      title: Add results to spreadsheet
      type: Output
