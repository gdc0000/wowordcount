---
name: wordcount
title: Word Count (LIWC-style)
menuGroup: Text
version: '1.0.0'
jas: '1.2'

description: |
    Counts words and phrases per category from a user-defined lexicon,
    LIWC-style: every matched term contributes its full document
    frequency to the categories it matches. Counts follow classic LIWC
    frequency semantics; results are not directly comparable to the
    original WordCount application.

refs: [tausczik2010, boyd2022]

options:
    - name: data
      type: Data

    - name: textVar
      title: Text Variable
      type: Variable
      permitted: [id, factor]

    - name: lexicon
      title: 'Lexicon: category and its terms'
      type: Array
      default:
        - category: Positivity
          terms: very, good, happy, amazing
        - category: Negations
          terms: not, non, never, no, niente
        - category: Modality
          terms: can*, could*, might*, may*, should*
      template:
        type: Group
        elements:
          - name: category
            type: String
            title: Category
          - name: terms
            type: String
            title: 'Terms (comma-separated)'
      description: |
        One category per row with its terms as a comma-separated list.
        A trailing * marks a prefix wildcard; multi-word terms are allowed.
        Terms longer than five words are ignored.
        The default rows are a working example: edit or remove them.

    - name: detectedWords
      title: Detected words columns
      type: Bool
      default: false

    - name: saveResults
      title: Append results to the data set
      type: Output
