---
name: wordcount
title: Word Count (LIWC-style)
menuGroup: Text
version: '0.1.0'
jas: '1.2'

options:
    - name: data
      type: Data

    - name: textVar
      title: Text Variable
      type: Variable
      permitted: [id, factor]

    - name: lexiconSource
      title: Lexicon source
      type: List
      options:
        - title: Build in the app
          name: builder
        - title: Paste a dictionary
          name: paste
      default: builder
      description: |
        Where the dictionary comes from. Exactly one source is used:
        `builder` counts with the categories defined in the lexicon builder
        below; `paste` counts with the wordlist pasted in the paste box.

    - name: lexicon
      title: 'Lexicon builder: category and its terms'
      type: Array
      default:
        - category: Positivity
          terms: very, good, happy, amazing
        - category: Negations
          terms: not, non, never, no, niente
        - category: Modality
          terms: can*, could*, might*, may*, should*
      template:
        type: Group
        elements:
          - name: category
            type: String
            title: Category
          - name: terms
            type: String
            title: 'Terms (comma-separated)'
      description: |
        Lexicon rows built in the UI: one category per row with its terms as a
        comma-separated list. A trailing * marks a prefix wildcard; multi-word
        terms are allowed.
        The default rows are a working example: edit or remove them.
        Only used when the lexicon source is set to `Build in the app`.

    - name: dictionary
      title: Dictionary
      type: String
      default: 'very:Intensifiers; not:Negations; can*:Modal_Expressions'
      description: |
        Paste your wordlist. Two formats are accepted:
        1) TSV with a DicTerm header (multi-line), or
        2) single-line flat format: very:Intensifiers; not:Negations; can*:Modal_Expressions
        Only used when the lexicon source is set to `Paste a dictionary`.

    - name: detectedWords
      title: Include detected words columns
      type: Bool
      default: false

    - name: saveResults
      title: Append results to the data set
      type: Output
