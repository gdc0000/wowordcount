---
name: wordcount
title: Word Count (LIWC-style)
jrs: '1.1'

items:
    - name: dictSummary
      title: Dictionary Summary
      type: Table
      rows: 0
      clearWith:
        - textVar
        - lexicon
      columns:
        - name: category
          title: Category
          type: text
        - name: exactTerms
          title: Exact Terms
          type: integer
        - name: wildcardPrefixes
          title: Wildcard Prefixes
          type: integer
        - name: multiWordTerms
          title: Multi-word Terms
          type: integer

    - name: catSummary
      title: Category Counts Summary
      type: Table
      rows: 0
      clearWith:
        - textVar
        - lexicon
      columns:
        - name: category
          title: Category
          type: text
        - name: totalCount
          title: Total Matches
          type: integer
        - name: meanCount
          title: Mean / Doc
          type: number
        - name: meanPerc
          title: Mean % of Tokens
          type: number
          format: zto
        - name: docCount
          title: Docs with Matches
          type: integer
        - name: docPerc
          title: '% of Docs'
          type: number
          format: zto

    - name: statusNote
      title: Status
      type: Preformatted
      visible: false
      clearWith:
        - textVar
        - lexicon

    - name: saveResults
      title: Append results to the data set
      type: Output
      initInRun: true
      clearWith:
        - textVar
        - lexicon
        - detectedWords
