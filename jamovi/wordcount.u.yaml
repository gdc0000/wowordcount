title: Word Count (LIWC-style)
name: wordcount
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Text Variable
        children:
          - type: VariablesListBox
            name: textVar
            isTarget: true
            maxItemCount: 1
            height: small
            ghostText: drag a text column here
  - type: Label
    label: Lexicon
  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: ListBox
        name: lexicon
        height: large
        showColumnHeaders: true
        fullRowSelect: true
        stretchFactor: 1
        addButton: Add category
        infoText: >-
          One category per row; terms as a comma-separated list.
          A trailing * marks a prefix wildcard; multi-word terms are allowed.
        columns:
          - name: category
            label: Category
            stretchFactor: 1
            template:
              type: TextBox
              label: ''
              format: string
          - name: terms
            label: Terms
            stretchFactor: 2
            template:
              type: TextBox
              label: ''
              format: string
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: detectedWords
  - type: CollapseBox
    label: Save
    collapsed: true
    stretchFactor: 1
    children:
      - type: Output
        name: saveResults
