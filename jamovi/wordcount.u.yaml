title: Word Count (LIWC-style)
name: wordcount
jus: '3.0'
stage: 0
compilerMode: tame
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: VariablesListBox
        name: textVar
        maxItemCount: 1
        height: small
  - type: LayoutBox
    margin: large
    children:
      - type: CheckBox
        name: detectedWords
      - type: Output
        name: saveResults
  - type: LayoutBox
    margin: large
    children:
      - type: ListBox
        name: lexicon
        height: large
        showColumnHeaders: false
        fullRowSelect: true
        stretchFactor: 1
        columns:
          - name: category
            stretchFactor: 1
            template:
              type: TextBox
              format: string
          - name: terms
            stretchFactor: 2
            template:
              type: TextBox
              format: string
      - type: TextBox
        name: dictionary
        format: string
