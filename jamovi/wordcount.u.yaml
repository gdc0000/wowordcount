---
title: Word Count (LIWC-style)
name: wordcount
jus: '3.0'
stage: 0
compilerMode: tame
children:
    - type: VariableSupplier
      persistentItems: false
      stretchFactor: 1
      children:
        - type: VariablesListBox
          name: textVar
          maxItemCount: 1
          height: 80
          dropTarget:
            title: Single text variable

    - type: LayoutBox
      margin: large
      children:
        - type: TextBox
          name: dictionary
          format: term
          width: 480
          height: 200
        - type: CheckBox
          name: detectedWords
        - type: CheckBox
          name: saveResults
